#
# mcp VDR plugin arguments, see /usr/share/doc/vdr-plugin-mcp/README
#
#   -b, --bind=ADDR         address to listen on (default: 127.0.0.1); any other
#                           address is reachable from the network WITHOUT
#                           authentication
#   -p, --port=PORT         TCP port of the MCP server (default: 6420)
#   -s, --svdrp-port=PORT   SVDRP port of this VDR (default: 6419)
#   -d, --deny=LIST         SVDRP commands that are not offered, comma separated;
#                           a trailing '*' matches any rest, PLUGIN.CMD a single
#                           plugin command; --deny= offers all. Without this
#                           option the plugin uses DEL*,HITK as well.
#   -m, --max-reply=BYTES   cut longer SVDRP replies (default: 262144)
#
# MCP client, e.g. Claude Code (the VDR host needs socat):
#   claude mcp add vdr -- ssh <user>@<vdr-host> socat STDIO TCP:127.0.0.1:6420
#
[mcp]
--deny=DEL*,HITK
