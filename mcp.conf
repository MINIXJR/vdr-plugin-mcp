#
# mcp VDR plugin arguments, see /usr/share/doc/vdr-plugin-mcp/README
#
#   -b, --bind=ADDR         address of the local MCP server (default: 127.0.0.1);
#                           any other address is reachable from the network
#                           WITHOUT authentication
#   -p, --port=PORT         TCP port of the local MCP server (default: 6420)
#   -s, --svdrp-port=PORT   SVDRP port of this VDR (default: 6419)
#   -d, --deny=LIST         SVDRP commands that are not offered, comma separated;
#                           a trailing '*' matches any rest, PLUGIN.CMD a single
#                           plugin command; --deny= offers all. Without this
#                           option the plugin uses DEL*,HITK as well.
#   -m, --max-reply=BYTES   cut longer SVDRP replies (default: 262144)
#   -l, --log[=UNIT]        offer the tool vdr_log with the journal of the
#                           systemd unit UNIT (default: vdr.service). Needs
#                           "adduser vdr systemd-journal" and a VDR restart;
#                           VDR can then read the WHOLE system journal.
#
# MCP over HTTPS for clients without SSH (off by default):
#   -w, --http=ADDR:PORT    e.g. 0.0.0.0:6421, endpoint https://<vdr-host>:6421/mcp
#   -c, --cert=FILE         TLS certificate; default: a self-signed one, created at
#   -k, --key=FILE          the first start in /var/lib/vdr/plugins/mcp/
#   -n, --http-plain        no TLS (only for tests, keys travel unencrypted)
#   -r, --ro-allow=LIST     more commands for read only keys (see README)
#   API keys: svdrpsend PLUG mcp KEYADD <name> ro|rw, KEYLIST, KEYDEL <name>
#
# MCP clients, e.g. Claude Code:
#   local over SSH (the VDR host needs socat):
#     claude mcp add vdr -- ssh <user>@<vdr-host> socat STDIO TCP:127.0.0.1:6420
#   over HTTPS:
#     claude mcp add --transport http vdr https://<vdr-host>:6421/mcp \
#       --header "Authorization: Bearer <key>"
#
[mcp]
--deny=DEL*,HITK
#--log
#--http=0.0.0.0:6421
